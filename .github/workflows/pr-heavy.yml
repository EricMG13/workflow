name: pr-heavy

on:
  pull_request:
    types: [labeled, synchronize, reopened]

concurrency:
  group: ${{ github.workflow }}-${{ github.event.pull_request.number }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  heavy:
    if: >-
      (github.event.action == 'labeled' && github.event.label.name == 'heavy-tests') ||
      (github.event.action != 'labeled' &&
      contains(github.event.pull_request.labels.*.name, 'heavy-tests'))
    runs-on: ubuntu-latest
    timeout-minutes: 360
    env:
      BASE: origin/${{ github.base_ref }}
    steps:
      - uses: actions/checkout@v5
        with:
          fetch-depth: 0
          persist-credentials: false
      - uses: astral-sh/setup-uv@18d369b23da25a81e9458561248e1aafff6a70fa # v10.3.1
        with:
          version: "0.12.5"
          python-version: "3.13.15"
          enable-cache: true
      - run: uv sync --locked
      - name: Affected heavy tests
        run: |
          set -euo pipefail
          files=$(uv run --frozen python -I cases/prove/affected_tests.py --tier heavy "$BASE" HEAD)
          if [ -z "$files" ]; then
            echo "no affected heavy tests"
            exit 0
          fi
          # shellcheck disable=SC2086
          uv run --frozen pytest $files -m "not live" --durations=25
