[project]
name = "deploy-workflow"
version = "0.1.0"
description = "Tool-assisted analytical modules and rendered deliverables"
requires-python = ">=3.13,<3.14"
dependencies = ["pydantic==2.14.1", "pypdf==6.21.2", "openpyxl==3.1.5"]

[tool.uv]
package = false
required-version = "==0.12.5"

[dependency-groups]
dev = ["pytest==9.1.1", "ruff==0.17.1", "mypy==2.4.0", "hypothesis==6.170.5"]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["src", "."]
addopts = "-ra --strict-markers"
markers = ["live: paid/provider execution; paused", "browser: real browser proof"]

[tool.ruff]
target-version = "py313"
line-length = 100

[tool.mypy]
python_version = "3.13"
strict = true
